<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values; without it the fixed action bar and timer dock sit under the
         iOS home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f17" />
    <meta name="description" content="Clubs is a VCT fantasy card game. Run a club, sign pros and win the league year after year. No login needed." />
    <meta property="og:title" content="Clubs" />
    <meta property="og:description" content="Run a club, sign VCT pros and win the league year after year. No login needed." />
    <meta property="og:type" content="website" />
    <!-- PLACEHOLDER: replace with the final share image, see docs/design-brief.md item 2. -->
    <meta property="og:image" content="/placeholders/og-share.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Clubs</title>

    <!-- Loaded here rather than via @import in the bundled CSS: an @import
         cannot start until the stylesheet is parsed, which serialises the
         request chain.

         Familjen Grotesk tops out at 700 - Google Fonts accepts a request for
         800/900 and silently serves only 400-700. The sheets used 800/900 in
         28 places, which never rendered as authored; those are normalised to
         700 in the CSS rather than requested here.

         crossorigin lets a share image read this sheet and embed the font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
