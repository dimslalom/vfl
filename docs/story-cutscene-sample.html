<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;700&display=swap">
<title>Sponsor Collapse Cutscene</title>
<style>:root{--ink:#ece8e1;--muted:#8a8f9e;--bg:#0f1923;--deep:#0a121a;--accent:#ff4655;--win:#00c8a0;--plate-inset:#2b3145;
  --display:"Familjen Grotesk",system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace;
  --notch:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
*{box-sizing:border-box;margin:0}
body{background:var(--deep);color:var(--ink);font:400 15px/1.4 var(--display);min-height:100vh;display:grid;place-items:center;overflow:hidden}
.stage{position:relative;width:min(100vw,177.8vh);aspect-ratio:16/9;overflow:hidden;background:var(--bg)}
.frame{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.frame.on{opacity:1}
.frame svg{width:100%;height:100%;display:block}
.frame.on .cam{animation:var(--cam) 7s ease-out forwards}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes panL{from{transform:scale(1.1) translateX(3%)}to{transform:scale(1.1) translateX(-2%)}}
@keyframes rise{from{transform:scale(1.06) translateY(2%)}to{transform:scale(1.06) translateY(-1%)}}
.cam{transform-origin:50% 50%}
.cap{position:absolute;left:4%;right:20%;bottom:7%;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline;opacity:0;transform:translateY(12px);transition:.5s .5s}
.frame.on .cap{opacity:1;transform:none}
.who{font:700 11px/1 var(--mono);letter-spacing:.14em;color:var(--win);text-transform:uppercase}
.line{font:700 clamp(15px,1.9vw,22px)/1.3 var(--display);max-width:46ch}
.hud{position:absolute;top:3.5%;left:4%;right:4%;display:flex;justify-content:space-between;align-items:center;font:700 10px/1 var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;z-index:3}
.ticks{display:flex;gap:4px}.ticks i{width:12px;height:2px;background:var(--plate-inset)}.ticks i.on{background:var(--muted)}
.choices{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}
.choice{position:relative;border:0;background:none;color:inherit;text-align:left;cursor:pointer;padding:0 40px 40px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;font:inherit}
/* selection corners: four L brackets, never a one-sided stroke */
.choice::after{content:"";position:absolute;inset:48px 12px 12px;opacity:0;transition:opacity .12s;pointer-events:none;
  --c:var(--win);--l:18px;--w:2px;
  background:
   linear-gradient(var(--c) 0 0) top left/var(--l) var(--w),linear-gradient(var(--c) 0 0) top left/var(--w) var(--l),
   linear-gradient(var(--c) 0 0) top right/var(--l) var(--w),linear-gradient(var(--c) 0 0) top right/var(--w) var(--l),
   linear-gradient(var(--c) 0 0) bottom left/var(--l) var(--w),linear-gradient(var(--c) 0 0) bottom left/var(--w) var(--l),
   linear-gradient(var(--c) 0 0) bottom right/var(--l) var(--w),linear-gradient(var(--c) 0 0) bottom right/var(--w) var(--l);
  background-repeat:no-repeat}
.choice:hover::after,.choice:focus-visible::after{opacity:1}
.choice:focus-visible{outline:none}
.choice .k{font:700 11px/1 var(--mono);color:var(--muted)}
.choice h3{font:700 clamp(15px,1.6vw,22px)/1.2 var(--display)}
.choice p{font:700 11px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.up{color:var(--win)}.dn{color:var(--accent)}
.next{position:absolute;right:4%;bottom:7%;z-index:3;border:0;background:var(--accent);color:#fff;font:700 15px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:15px 24px;clip-path:var(--notch);cursor:pointer}
@media (max-width:640px){.choices{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr)}.choice{padding:0 32px 28px}.cap{right:4%;bottom:18%}}
@media (prefers-reduced-motion:reduce){.frame.on .cam{animation:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
<div class="hud"><span>Act II</span><span class="ticks" id="ticks"></span></div>

<!-- 1: arena exterior, sponsor sign dies -->
<section class="frame" style="--cam:push">
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><g class="cam">
<image href="cutscene-frames/arena.png" x="0" y="0" width="1600" height="900"/>
</g></svg>
<div class="cap"><span class="who">02:14</span><p class="line">The sign over the arena went dark at 2 a.m. Nova Bank filed before sunrise.</p></div>
</section>

<!-- 2: boardroom, chart falling -->
<section class="frame" style="--cam:panL">
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><g class="cam">
<image href="cutscene-frames/board.png" x="0" y="0" width="1600" height="900"/>
</g></svg>
<div class="cap"><span class="who">Board</span><p class="line">Three weeks of capital left. Something on this roster gets sold, or the doors close.</p></div>
</section>

<!-- 3: corridor, rival hands brawk a contract -->
<section class="frame" style="--cam:rise">
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><g class="cam">
<image href="cutscene-frames/corridor.png" x="0" y="0" width="1600" height="900"/>
</g></svg>
<div class="cap"><span class="who">Stallions Esports</span><p class="line">"Starting role, double the salary. Your manager already knows we are here."</p></div>
</section>

<!-- 4: decision, each choice is its own illustrated panel -->
<section class="frame" style="--cam:push" id="decide">
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><g class="cam">
<image href="cutscene-frames/decide.png" x="0" y="0" width="1600" height="900"/>
</g></svg>
<div class="choices">
<button class="choice" data-k="1"><span class="k">1</span><h3>Sell brawk</h3><p class="up">+7 silver packs</p><p class="dn">Brawk joins Stallions</p></button>
<button class="choice" data-k="2"><span class="k">2</span><h3>Cut the analysts</h3><p class="up">+10 trust</p><p class="dn">+15 fatigue to starters</p></button>
<button class="choice" data-k="3"><span class="k">3</span><h3>Crowdfund it</h3><p class="up">+15 trust</p><p class="dn">-40 reputation</p></button>
</div>
</section>

<button class="next" id="next">Next</button>
</div>
<script>
const frames=[...document.querySelectorAll('.frame')],ticks=document.getElementById('ticks'),next=document.getElementById('next');
frames.forEach(()=>ticks.append(document.createElement('i')));
let i=0;
function show(n){i=Math.max(0,Math.min(frames.length-1,n));frames.forEach((f,j)=>f.classList.toggle('on',j===i));[...ticks.children].forEach((t,j)=>t.classList.toggle('on',j<=i));next.hidden=i===frames.length-1}
next.onclick=()=>show(i+1);
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelector('#decide .choices').innerHTML='<p class="cap" style="opacity:1;transform:none"><span class="who">Picked</span><span class="line">'+b.querySelector('h3').textContent+'</span></p>'});
addEventListener('keydown',e=>{if(['ArrowRight','Enter',' '].includes(e.key))show(i+1);if(e.key==='ArrowLeft')show(i-1);const c=document.querySelector(`.choice[data-k="${e.key}"]`);if(c&&i===frames.length-1)c.click()});
show(0);
</script>
</body>
</html>
